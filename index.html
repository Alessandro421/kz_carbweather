<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KZ CarbWeather">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>KZ CarbWeather — Dell'Orto VHSH 30 CS</title></head><body>
<div id="app">Caricamento…</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async()=>{
 const parts=await Promise.all(['ui1.html','ui2.html','ui3.html'].map(x=>fetch(x).then(r=>r.text())));
 document.getElementById('app').outerHTML=parts.join('');
 for(const src of ['data.js','core1.js','core2.js','telemetry.js','app-final.js']){await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.body.appendChild(s);});}
})();
</script></body></html>
